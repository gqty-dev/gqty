name: Deploy Documentation to Pages

# Builds the static documentation site in `website/` and deploys it to GitHub
# Pages (https://gqty-dev.github.io/gqty/). No secrets are used: the build only
# needs a read-only checkout, and the deployment uses the OIDC token that
# GitHub Pages issues to the `github-pages` environment.

on:
  push:
    branches:
      - main
      # Temporary pre-merge verification lane. It lets the Pages deployment be
      # exercised on this branch before the pull request merges, without
      # promoting it to a permanent trigger. Remove this entry together with
      # the `WEBSITE_PREVIEW_REF` repository variable and the `deploy-preview`
      # job once the branch merges; that job is skipped unless the variable
      # names this exact ref.
      - fix/remove-expired-domain
    paths:
      - 'website/**'
      - '.github/workflows/pages.yaml'
  pull_request:
    # Pull requests only validate the build; they never deploy.
    paths:
      - 'website/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

env:
  CI: true

# Read-only by default. The deployment job requests the extra scopes it needs.
permissions:
  contents: read

# One deployment at a time. `cancel-in-progress: false` is deliberate: an
# in-flight production deployment must be allowed to finish rather than being
# cancelled by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # `website/` is not a member of the root pnpm workspace: it has its own
      # lockfile. `--ignore-workspace` keeps the install from resolving the
      # parent monorepo and touching the root `pnpm-lock.yaml`.
      - name: Install dependencies
        run: pnpm --ignore-workspace --dir website install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir website check

      - name: Test
        run: pnpm --dir website test

      - name: Check formatting
        run: pnpm --dir website format:check

      - name: Build
        run: pnpm --dir website build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check static export
        run: pnpm --dir website check:export

      # GitHub Pages runs the export through Jekyll unless `.nojekyll` is
      # present, which would drop the `_next/` directory. The upload step below
      # must therefore include hidden files.
      - name: Disable Jekyll
        run: touch website/out/.nojekyll

      # Uploading is safe on pull requests: the artifact is produced for
      # validation only and the deploy job never runs for those events.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
          include-hidden-files: true

  # Production deployment. Runs only for pushes to `main` and manual runs from
  # `main`, so a pull request — including one from a fork — can never deploy.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled for the repository. `enablement` defaults
      # to `false`, so this never attempts to enable Pages with the limited
      # `GITHUB_TOKEN` scopes granted here; it only reads the site metadata.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Temporary pre-merge preview lane. It deploys the verification branch to the
  # production Pages URL only when the repository variable
  # `WEBSITE_PREVIEW_REF` explicitly opts in:
  #
  #   WEBSITE_PREVIEW_REF = refs/heads/fix/remove-expired-domain
  #
  # With the variable unset (the default) this job is skipped, so nothing but
  # `main` reaches the published site. The ref must match both the variable and
  # this hard-coded branch exactly, so a fork or any other ref can never
  # deploy. Enabling the variable therefore publishes this branch's content at
  # https://gqty-dev.github.io/gqty/ until the next `main` deployment — that is
  # the intended live verification. Remove this job, the `WEBSITE_PREVIEW_REF`
  # variable, and the branch entry in `on.push.branches` after the merge.
  deploy-preview:
    name: Deploy preview to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/fix/remove-expired-domain' &&
      vars.WEBSITE_PREVIEW_REF == github.ref
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
